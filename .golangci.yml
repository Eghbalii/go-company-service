run:
  timeout: 5m
  tests: true

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/eghbalii/go-company-service
  govet:
    check-shadowing: true
  revive:
    rules:
      - name: exported
        severity: warning
  exhaustive:
    default-signifies-exhaustive: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  misspell:
    locale: US
  gosec:
    excludes:
      - G401
      - G501
  funlen:
    lines: 80
    statements: 50
  cyclop:
    max-complexity: 15

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - misspell
    - gocritic
    - gosec
    - exhaustive
    - funlen
    - cyclop
    - noctx
    - bodyclose
    - contextcheck
    - nilerr

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - gosec
    - path: internal/infrastructure
      linters:
        - funlen
    - path: cmd/api/main.go
      linters:
        - funlen
    - path: docs/
      linters:
        - all

  max-issues-per-linter: 50
  max-same-issues: 10
